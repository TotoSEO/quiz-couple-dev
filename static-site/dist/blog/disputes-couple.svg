<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f0a0a"/>
      <stop offset="50%" stop-color="#1a0820"/>
      <stop offset="100%" stop-color="#120518"/>
    </linearGradient>
    <linearGradient id="bubbleL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e87d4a"/>
      <stop offset="100%" stop-color="#d4618c"/>
    </linearGradient>
    <linearGradient id="bubbleR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4618c"/>
      <stop offset="100%" stop-color="#8b5cc2"/>
    </linearGradient>
    <linearGradient id="merge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e87d4a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cc2" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="225" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e87d4a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e87d4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="200" fill="url(#glow)"/>
  <!-- Left speech bubble -->
  <g opacity="0.9">
    <rect x="130" y="100" width="200" height="130" rx="24" fill="none" stroke="url(#bubbleL)" stroke-width="2.5"/>
    <polygon points="240,230 260,265 215,230" fill="none" stroke="url(#bubbleL)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Expression lines (tension) -->
    <line x1="175" y1="150" x2="215" y2="150" stroke="#e87d4a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="175" y1="168" x2="285" y2="168" stroke="#e87d4a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="175" y1="186" x2="255" y2="186" stroke="#e87d4a" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  </g>
  <!-- Right speech bubble -->
  <g opacity="0.9">
    <rect x="470" y="120" width="200" height="130" rx="24" fill="none" stroke="url(#bubbleR)" stroke-width="2.5"/>
    <polygon points="560,250 540,285 585,250" fill="none" stroke="url(#bubbleR)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Expression lines (tension) -->
    <line x1="515" y1="170" x2="555" y2="170" stroke="#8b5cc2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="515" y1="188" x2="625" y2="188" stroke="#8b5cc2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="515" y1="206" x2="595" y2="206" stroke="#8b5cc2" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  </g>
  <!-- Merging / convergence zone -->
  <ellipse cx="400" cy="340" rx="110" ry="50" fill="url(#merge)" stroke="none"/>
  <g transform="translate(400,335) scale(0.7)" opacity="0.75">
    <path d="M0,12 C0,-6 -18,-6 -18,6 C-18,18 0,30 0,30 C0,30 18,18 18,6 C18,-6 0,-6 0,12Z" fill="#d4618c"/>
  </g>
  <!-- Connecting arcs from bubbles to heart -->
  <path d="M250,250 C270,310 340,340 380,340" fill="none" stroke="#e87d4a" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4"/>
  <path d="M550,270 C530,310 460,340 420,340" fill="none" stroke="#8b5cc2" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4"/>
  <!-- Subtle sparks around bubbles -->
  <circle cx="160" cy="90" r="3" fill="#e87d4a" opacity="0.3"/>
  <circle cx="340" cy="110" r="2" fill="#d4618c" opacity="0.25"/>
  <circle cx="460" cy="105" r="2.5" fill="#8b5cc2" opacity="0.25"/>
  <circle cx="680" cy="130" r="3" fill="#8b5cc2" opacity="0.2"/>
  <circle cx="120" cy="240" r="1.5" fill="#e87d4a" opacity="0.2"/>
  <circle cx="690" cy="260" r="1.5" fill="#8b5cc2" opacity="0.2"/>
</svg>