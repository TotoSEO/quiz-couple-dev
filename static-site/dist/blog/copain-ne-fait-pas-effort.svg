<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b0a12"/>
      <stop offset="55%" stop-color="#170820"/>
      <stop offset="100%" stop-color="#100518"/>
    </linearGradient>
    <linearGradient id="heavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e87d4a"/>
      <stop offset="100%" stop-color="#d4618c"/>
    </linearGradient>
    <radialGradient id="glowE" cx="400" cy="220" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e87d4a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e87d4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="240" fill="url(#glowE)"/>
  <!-- Balance: fulcrum -->
  <line x1="400" y1="150" x2="400" y2="360" stroke="#f0d9c8" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M360,360 L440,360 L420,392 L380,392 Z" fill="none" stroke="#f0d9c8" stroke-width="3" stroke-linejoin="round" opacity="0.55"/>
  <!-- Tilted beam (one side gives more) -->
  <g transform="rotate(11 400 150)">
    <line x1="205" y1="150" x2="595" y2="150" stroke="#f0d9c8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Left pan: heavy, full heart (her effort) -->
    <line x1="240" y1="150" x2="240" y2="196" stroke="#f0d9c8" stroke-width="2" opacity="0.6"/>
    <path d="M240,236 a34,20 0 0 1 -60,-14 M240,236 a34,20 0 0 0 60,-14" fill="none" stroke="#f0d9c8" stroke-width="2" opacity="0.6"/>
    <path d="M240,196 C240,178 214,178 214,196 C214,214 240,232 240,232 C240,232 266,214 266,196 C266,178 240,178 240,196Z"
          fill="url(#heavy)" opacity="0.92"/>
    <!-- Right pan: light, empty outline heart (his effort) -->
    <line x1="560" y1="150" x2="560" y2="120" stroke="#f0d9c8" stroke-width="2" opacity="0.5"/>
    <path d="M560,80 a30,18 0 0 1 -54,-12 M560,80 a30,18 0 0 0 54,-12" fill="none" stroke="#8b5cc2" stroke-width="2" opacity="0.5"/>
    <path d="M560,100 C560,86 538,86 538,100 C538,116 560,132 560,132 C560,132 582,116 582,100 C582,86 560,86 560,100Z"
          fill="none" stroke="#8b5cc2" stroke-width="2.5" stroke-dasharray="4,5" opacity="0.7"/>
  </g>
  <!-- Sparks -->
  <circle cx="250" cy="120" r="3" fill="#e87d4a" opacity="0.3"/>
  <circle cx="600" cy="200" r="2.5" fill="#8b5cc2" opacity="0.25"/>
  <circle cx="180" cy="260" r="2" fill="#d4618c" opacity="0.22"/>
  <circle cx="640" cy="320" r="1.5" fill="#e87d4a" opacity="0.2"/>
</svg>
