<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f0a14"/>
      <stop offset="55%" stop-color="#1a0820"/>
      <stop offset="100%" stop-color="#120518"/>
    </linearGradient>
    <linearGradient id="flagF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4618c"/>
      <stop offset="100%" stop-color="#8b5cc2"/>
    </linearGradient>
    <radialGradient id="glowF" cx="400" cy="225" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4618c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d4618c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="240" fill="url(#glowF)"/>
  <!-- Flag pole -->
  <line x1="470" y1="95" x2="470" y2="360" stroke="#f0d9c8" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="470" cy="90" r="7" fill="#f0d9c8" opacity="0.85"/>
  <!-- Waving flag (mirrored) -->
  <path d="M470,110 C400,90 360,150 300,128 C320,175 295,205 310,232 C370,254 410,196 470,220 Z"
        fill="url(#flagF)" opacity="0.92"/>
  <!-- Cracked heart on the flag -->
  <g transform="translate(388,168) scale(0.9)" opacity="0.9">
    <path d="M0,10 C0,-6 -18,-6 -18,6 C-18,18 0,30 0,30 C0,30 18,18 18,6 C18,-6 0,-6 0,10Z" fill="#1a0820"/>
    <polyline points="0,2 -5,12 4,18 -2,28" fill="none" stroke="#d4618c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Alert triangle (subtle, background) -->
  <g opacity="0.4">
    <path d="M180,300 L240,300 L210,248 Z" fill="none" stroke="#d4618c" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="210" y1="266" x2="210" y2="284" stroke="#d4618c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="210" cy="293" r="1.8" fill="#d4618c"/>
  </g>
  <!-- Ground line -->
  <line x1="390" y1="360" x2="560" y2="360" stroke="#8b5cc2" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Sparks -->
  <circle cx="280" cy="120" r="3" fill="#d4618c" opacity="0.3"/>
  <circle cx="560" cy="160" r="2" fill="#8b5cc2" opacity="0.25"/>
  <circle cx="170" cy="200" r="2.5" fill="#e8593a" opacity="0.22"/>
  <circle cx="520" cy="300" r="1.5" fill="#d4618c" opacity="0.2"/>
</svg>
