<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f0a0a"/>
      <stop offset="55%" stop-color="#1a0816"/>
      <stop offset="100%" stop-color="#120518"/>
    </linearGradient>
    <linearGradient id="flag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8593a"/>
      <stop offset="100%" stop-color="#d4618c"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="225" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8593a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8593a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="240" fill="url(#glow)"/>
  <!-- Flag pole -->
  <line x1="330" y1="95" x2="330" y2="360" stroke="#f0d9c8" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="330" cy="90" r="7" fill="#f0d9c8" opacity="0.85"/>
  <!-- Waving flag -->
  <path d="M330,110 C400,90 440,150 500,128 C480,175 505,205 490,232 C430,254 390,196 330,220 Z"
        fill="url(#flag)" opacity="0.92"/>
  <!-- Warning mark on the flag -->
  <line x1="408" y1="150" x2="408" y2="185" stroke="#1a0816" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="408" cy="202" r="4" fill="#1a0816" opacity="0.85"/>
  <!-- Alert triangle (subtle, background) -->
  <g opacity="0.4">
    <path d="M560,300 L620,300 L590,248 Z" fill="none" stroke="#e8593a" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="590" y1="266" x2="590" y2="284" stroke="#e8593a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="590" cy="293" r="1.8" fill="#e8593a"/>
  </g>
  <!-- Ground line -->
  <line x1="250" y1="360" x2="410" y2="360" stroke="#8b5cc2" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Sparks -->
  <circle cx="520" cy="120" r="3" fill="#e8593a" opacity="0.3"/>
  <circle cx="250" cy="160" r="2" fill="#d4618c" opacity="0.25"/>
  <circle cx="640" cy="200" r="2.5" fill="#8b5cc2" opacity="0.25"/>
  <circle cx="300" cy="300" r="1.5" fill="#e8593a" opacity="0.2"/>
</svg>
