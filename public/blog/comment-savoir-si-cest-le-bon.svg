<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0a16"/>
      <stop offset="50%" stop-color="#1a0620"/>
      <stop offset="100%" stop-color="#0f0312"/>
    </linearGradient>
    <linearGradient id="heart" x1="340" y1="100" x2="460" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e87d4a"/>
      <stop offset="40%" stop-color="#d4618c"/>
      <stop offset="100%" stop-color="#b8547a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4618c"/>
      <stop offset="100%" stop-color="#e87d4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="210" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4618c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4618c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="checkGlow" cx="420" cy="190" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="210" r="180" fill="url(#glow)"/>
  <!-- Large heart -->
  <g transform="translate(400,185) scale(3.2)" opacity="0.85">
    <path d="M0,15 C0,-8 -22,-8 -22,7 C-22,22 0,38 0,38 C0,38 22,22 22,7 C22,-8 0,-8 0,15Z" fill="none" stroke="url(#heart)" stroke-width="1.8"/>
  </g>
  <!-- Inner heart fill (subtle) -->
  <g transform="translate(400,185) scale(3.2)" opacity="0.15">
    <path d="M0,15 C0,-8 -22,-8 -22,7 C-22,22 0,38 0,38 C0,38 22,22 22,7 C22,-8 0,-8 0,15Z" fill="#d4618c"/>
  </g>
  <!-- Magnifying glass -->
  <g transform="translate(480,160)" opacity="0.85">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#glass)" stroke-width="2.8"/>
    <line x1="32" y1="32" x2="65" y2="65" stroke="#e87d4a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Glass handle end -->
    <circle cx="68" cy="68" r="5" fill="none" stroke="#e87d4a" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Checkmark inside magnifying glass -->
  <circle cx="480" cy="160" r="50" fill="url(#checkGlow)"/>
  <polyline points="462,162 475,176 500,148" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Sparkle accents around heart -->
  <g opacity="0.5">
    <!-- Top sparkle -->
    <line x1="400" y1="60" x2="400" y2="72" stroke="#e87d4a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="394" y1="66" x2="406" y2="66" stroke="#e87d4a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left sparkle -->
    <line x1="280" y1="150" x2="280" y2="160" stroke="#d4618c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="275" y1="155" x2="285" y2="155" stroke="#d4618c" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bottom left sparkle -->
    <line x1="320" y1="330" x2="320" y2="340" stroke="#d4618c" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="315" y1="335" x2="325" y2="335" stroke="#d4618c" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Small floating hearts -->
  <g transform="translate(310,90) scale(0.35)" opacity="0.4">
    <path d="M0,8 C0,-4 -12,-4 -12,4 C-12,12 0,20 0,20 C0,20 12,12 12,4 C12,-4 0,-4 0,8Z" fill="#d4618c"/>
  </g>
  <g transform="translate(560,100) scale(0.3)" opacity="0.35">
    <path d="M0,8 C0,-4 -12,-4 -12,4 C-12,12 0,20 0,20 C0,20 12,12 12,4 C12,-4 0,-4 0,8Z" fill="#e87d4a"/>
  </g>
  <g transform="translate(260,260) scale(0.25)" opacity="0.3">
    <path d="M0,8 C0,-4 -12,-4 -12,4 C-12,12 0,20 0,20 C0,20 12,12 12,4 C12,-4 0,-4 0,8Z" fill="#8b5cc2"/>
  </g>
  <!-- Ambient particles -->
  <circle cx="130" cy="100" r="1.5" fill="#d4618c" opacity="0.2"/>
  <circle cx="680" cy="80" r="2" fill="#e87d4a" opacity="0.2"/>
  <circle cx="100" cy="350" r="1" fill="#8b5cc2" opacity="0.15"/>
  <circle cx="700" cy="370" r="1.5" fill="#d4618c" opacity="0.15"/>
  <circle cx="400" cy="410" r="1.5" fill="#c76aad" opacity="0.12"/>
  <circle cx="200" cy="50" r="1" fill="#fff" opacity="0.1"/>
  <circle cx="620" cy="400" r="1" fill="#fff" opacity="0.1"/>
</svg>