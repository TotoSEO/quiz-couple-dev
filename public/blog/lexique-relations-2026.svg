<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#180a1c"/>
      <stop offset="55%" stop-color="#150820"/>
      <stop offset="100%" stop-color="#0f0518"/>
    </linearGradient>
    <linearGradient id="bubL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e87d4a"/>
      <stop offset="100%" stop-color="#d4618c"/>
    </linearGradient>
    <linearGradient id="bubR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4618c"/>
      <stop offset="100%" stop-color="#8b5cc2"/>
    </linearGradient>
    <radialGradient id="glowL" cx="400" cy="225" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4618c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#d4618c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="240" fill="url(#glowL)"/>
  <!-- Big speech bubble with "Aa" (the lexicon) -->
  <g opacity="0.95">
    <rect x="210" y="120" width="230" height="150" rx="28" fill="none" stroke="url(#bubL)" stroke-width="3"/>
    <polygon points="270,270 258,308 306,270" fill="none" stroke="url(#bubL)" stroke-width="3" stroke-linejoin="round"/>
    <text x="325" y="220" font-family="Poppins, Inter, sans-serif" font-size="86" font-weight="700"
          fill="#f0d9c8" text-anchor="middle" opacity="0.92">Aa</text>
  </g>
  <!-- Small speech bubble with the year "2026" -->
  <g opacity="0.9">
    <rect x="470" y="200" width="180" height="96" rx="22" fill="none" stroke="url(#bubR)" stroke-width="2.6"/>
    <polygon points="560,296 574,324 526,296" fill="none" stroke="url(#bubR)" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="560" y="262" font-family="Poppins, Inter, sans-serif" font-size="40" font-weight="600"
          fill="#d4618c" text-anchor="middle" opacity="0.9">2026</text>
  </g>
  <!-- Definition lines (glossary rhythm) inside a hint of a page -->
  <g stroke="#8b5cc2" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="150" y1="330" x2="300" y2="330"/>
    <line x1="150" y1="352" x2="250" y2="352"/>
    <line x1="470" y1="360" x2="620" y2="360"/>
    <line x1="470" y1="382" x2="560" y2="382"/>
  </g>
  <!-- Sparks -->
  <circle cx="180" cy="150" r="3" fill="#e87d4a" opacity="0.3"/>
  <circle cx="470" cy="130" r="2.5" fill="#d4618c" opacity="0.25"/>
  <circle cx="660" cy="180" r="2.5" fill="#8b5cc2" opacity="0.25"/>
  <circle cx="410" cy="330" r="1.5" fill="#e87d4a" opacity="0.2"/>
</svg>
