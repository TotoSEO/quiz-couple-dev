<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="lbBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="55%" stop-color="#170820"/>
      <stop offset="100%" stop-color="#100518"/>
    </linearGradient>
    <linearGradient id="lbWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e87d4a"/>
      <stop offset="100%" stop-color="#d4618c"/>
    </linearGradient>
    <linearGradient id="lbCool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4618c"/>
      <stop offset="100%" stop-color="#8b5cc2"/>
    </linearGradient>
    <radialGradient id="lbGlow" cx="470" cy="250" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4618c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d4618c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lbBait" cx="470" cy="252" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e87d4a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#e87d4a" stop-opacity="0"/>
    </radialGradient>
    <!-- Coeur unitaire, reutilise a differentes echelles pour la pluie -->
    <path id="lbHeart" d="M0 6 C -7 -3 -14 -8 -14 -15 C -14 -21 -9 -25 -4 -25 C -1 -25 1 -23 0 -21
                          C -1 -23 1 -25 4 -25 C 9 -25 14 -21 14 -15 C 14 -8 7 -3 0 6 Z"/>
  </defs>

  <rect width="800" height="450" fill="url(#lbBg)"/>
  <circle cx="470" cy="250" r="250" fill="url(#lbGlow)"/>

  <!-- Pluie de coeurs : le bombardement d'amour, dense en haut, qui se disperse -->
  <g opacity="0.9">
    <g transform="translate(120 78) scale(1.05)" opacity="0.5"><use href="#lbHeart" fill="url(#lbCool)"/></g>
    <g transform="translate(206 46) scale(0.8)" opacity="0.38"><use href="#lbHeart" fill="url(#lbCool)"/></g>
    <g transform="translate(285 96) scale(1.25)" opacity="0.62"><use href="#lbHeart" fill="url(#lbWarm)"/></g>
    <g transform="translate(368 40) scale(0.72)" opacity="0.34"><use href="#lbHeart" fill="url(#lbCool)"/></g>
    <g transform="translate(432 104) scale(0.95)" opacity="0.5"><use href="#lbHeart" fill="url(#lbWarm)"/></g>
    <g transform="translate(524 52) scale(1.12)" opacity="0.44"><use href="#lbHeart" fill="url(#lbCool)"/></g>
    <g transform="translate(608 92) scale(0.78)" opacity="0.36"><use href="#lbHeart" fill="url(#lbWarm)"/></g>
    <g transform="translate(682 44) scale(1)" opacity="0.3"><use href="#lbHeart" fill="url(#lbCool)"/></g>
    <g transform="translate(158 168) scale(0.68)" opacity="0.3"><use href="#lbHeart" fill="url(#lbWarm)"/></g>
    <g transform="translate(252 200) scale(0.9)" opacity="0.36"><use href="#lbHeart" fill="url(#lbCool)"/></g>
    <g transform="translate(646 186) scale(0.85)" opacity="0.32"><use href="#lbHeart" fill="url(#lbWarm)"/></g>
    <g transform="translate(712 148) scale(0.6)" opacity="0.24"><use href="#lbHeart" fill="url(#lbCool)"/></g>
  </g>

  <!-- Trainees de chute, pour lire le mouvement vers le bas -->
  <g stroke="#d4618c" stroke-linecap="round" opacity="0.16">
    <line x1="206" y1="8" x2="206" y2="30" stroke-width="2"/>
    <line x1="368" y1="4" x2="368" y2="26" stroke-width="2"/>
    <line x1="524" y1="10" x2="524" y2="34" stroke-width="2"/>
    <line x1="682" y1="6" x2="682" y2="28" stroke-width="2"/>
    <line x1="285" y1="52" x2="285" y2="72" stroke-width="2.5"/>
  </g>

  <!-- Le fil et l'hamecon : l'appat au milieu de l'abondance -->
  <line x1="470" y1="0" x2="470" y2="196" stroke="#8b5cc2" stroke-width="2" opacity="0.5"/>
  <circle cx="470" cy="252" r="70" fill="url(#lbBait)"/>
  <!-- Coeur-appat, plus grand et lumineux que les autres -->
  <g transform="translate(470 262) scale(3.1)">
    <use href="#lbHeart" fill="url(#lbWarm)"/>
  </g>
  <!-- Hamecon qui traverse le coeur, discret mais lisible -->
  <path d="M470 196 L470 250 C470 268 456 278 444 270 C437 265 438 255 446 253"
        fill="none" stroke="#f4e3c8" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <path d="M446 253 L437 247 M446 253 L440 262"
        fill="none" stroke="#f4e3c8" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- Silhouette qui tend la main vers l'appat, en bas a gauche -->
  <g opacity="0.85">
    <circle cx="150" cy="300" r="21" fill="#8b5cc2" opacity="0.75"/>
    <path d="M150 324 C132 324 120 338 120 358 L120 424 L180 424 L180 358 C180 338 168 324 150 324 Z"
          fill="#8b5cc2" opacity="0.6"/>
    <!-- Bras tendu vers l'appat : epaule, avant-bras leve, puis la main -->
    <path d="M172 340 C204 334 240 316 274 296"
          fill="none" stroke="#8b5cc2" stroke-width="12" stroke-linecap="round" opacity="0.62"/>
    <path d="M274 296 C292 286 308 280 322 277"
          fill="none" stroke="#8b5cc2" stroke-width="10" stroke-linecap="round" opacity="0.66"/>
    <circle cx="330" cy="275" r="8" fill="#8b5cc2" opacity="0.72"/>
  </g>

  <!-- Ligne d'horizon douce, pour asseoir la scene -->
  <path d="M0 424 L800 424" stroke="#d4618c" stroke-width="1.5" opacity="0.14"/>
</svg>
