name: Scheduled site rebuild

on:
  # Le « schedule » de GitHub saute la plupart des départs sur ce dépôt
  # (relevé du 1er au 7 octobre 2026 : trois départs par jour sur sept, jusqu'à
  # quatre heures de retard). L'horloge réelle est pg_cron, dans Supabase, qui
  # lance ce workflow par workflow_dispatch aux mêmes sept heures (migration
  # 20261008180000_horloge_site_et_controle.sql, tâche site-reconstruction).
  # Le « schedule » reste en secours ; un double départ ne fait qu'un second
  # build identique.
  schedule:
    # Every 2 hours from 7h to 19h (UTC: 5h-17h for CET, 6h-18h for CEST)
    # Using CET (winter) times, adjust if needed for summer
    - cron: '0 6,8,10,12,14,16 * * *'
    # Once at 3h AM (CET = 2h UTC winter)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet : sans lui, git ne connaît qu'un commit et le
          # sitemap redaterait toutes les pages à chaque reconstruction, sept
          # fois par jour, alors que le contenu n'a pas bougé.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd static-site && npm ci

      - name: Rafraîchir ads.txt depuis la régie
        # La régie fournit un fichier PHP qui interroge son serveur à chaque
        # requête. GitHub Pages n'exécute pas de PHP : on fait la même chose
        # ici, à la construction. Le script ne remplace le fichier que si la
        # réponse est plausible, et sort en succès sinon : une régie
        # injoignable ne doit jamais bloquer un déploiement ni publier un
        # ads.txt vide.
        run: node static-site/build/rafraichir-ads-txt.mjs

      - name: Build static site
        run: cd static-site && npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to gh-pages branch (quiz-couple.com)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static-site/dist
          cname: quiz-couple.com
