name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet : le sitemap tire le lastmod de chaque page du
          # dernier commit qui a touché ses fichiers source. Avec le clone
          # superficiel par défaut, git ne connaît qu'un commit et toutes les
          # pages hériteraient de la date du déploiement.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd static-site && npm ci

      - name: Build static site
        run: cd static-site && npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to gh-pages branch (quiz-couple.com)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static-site/dist
          cname: quiz-couple.com

      - name: Submit URLs to IndexNow
        run: cd static-site && npm run indexnow
        continue-on-error: true
