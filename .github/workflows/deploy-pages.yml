name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      indexnow:
        description: "IndexNow : annoncer ce qui a changé, ou toutes les pages (remise à plat de l'index d'un moteur)"
        type: choice
        options:
          - changements
          - tout
        default: changements

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet : le sitemap tire le lastmod de chaque page du
          # dernier commit qui a touché ses fichiers source. Avec le clone
          # superficiel par défaut, git ne connaît qu'un commit et toutes les
          # pages hériteraient de la date du déploiement.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd static-site && npm ci

      - name: Rafraîchir ads.txt depuis la régie
        # La régie fournit un fichier PHP qui interroge son serveur à chaque
        # requête. GitHub Pages n'exécute pas de PHP : on fait la même chose
        # ici, à la construction. Le script ne remplace le fichier que si la
        # réponse est plausible, et sort en succès sinon : une régie
        # injoignable ne doit jamais bloquer un déploiement ni publier un
        # ads.txt vide.
        run: node static-site/build/rafraichir-ads-txt.mjs

      - name: Build static site
        run: cd static-site && npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: IndexNow · garder les sitemaps publiés
        # Avant la mise en ligne : les sitemaps que le site sert encore, pour
        # n'annoncer ensuite que ce qui a changé, et le témoin de cette mise en
        # ligne dans dist (build/indexnow.js).
        run: cd static-site && node build/indexnow.js --avant
        continue-on-error: true

      - name: Deploy to gh-pages branch (quiz-couple.com)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static-site/dist
          cname: quiz-couple.com

      - name: IndexNow · annoncer ce qui a changé
        # Attend que le site serve le témoin, puis envoie les pages nouvelles,
        # modifiées ou retirées. Un refus s'écrit en annotation sur cette page,
        # il ne fait jamais échouer la mise en ligne.
        run: cd static-site && node build/indexnow.js ${{ inputs.indexnow == 'tout' && '--all' || '' }}
        continue-on-error: true
