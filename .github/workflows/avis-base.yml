name: Avis · base Supabase

# Applique 20261012120000_avis_langue.sql puis 20261012160000_avis_par_test.sql
# par l'API de gestion de Supabase,
# comme securite-base.yml, avec les secrets déjà là pour les fonctions
# (SUPABASE_ACCESS_TOKEN et SUPABASE_PROJECT_REF). Rien à faire à la main.
#
# La première ajoute la langue de la page aux avis (colonne lang, que les
# formulaires du site envoient) et un premier classement des pages rangé par
# langue ; la seconde le remplace par un classement toutes langues confondues
# (admin_avis_par_test) et retire les fonctions de la première. Elles ne
# ferment rien : elles peuvent passer avant comme après la publication du
# site, et un formulaire qui envoie la langue avant qu'elle existe renvoie
# l'avis sans elle.
#
# Le relancer (« Run workflow ») est toujours sans risque : les migrations
# sont idempotentes, et passent toujours dans cet ordre.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261012120000_avis_langue.sql'
      - 'supabase/migrations/20261012160000_avis_par_test.sql'
      - '.github/workflows/avis-base.yml'
  workflow_dispatch:

concurrency:
  group: avis-base
  cancel-in-progress: false

jobs:
  migration:
    name: Langue des avis et classement des pages
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # La dernière requête de chaque migration rend un bilan (nombre d'avis,
      # pages) : il est affiché dans le journal.
      - name: Appliquer les migrations
        run: |
          for f in supabase/migrations/20261012120000_avis_langue.sql supabase/migrations/20261012160000_avis_par_test.sql; do
            jq -Rs '{query: .}' "$f" > requete.json
            code=$(curl -sS -o reponse.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data @requete.json)
            echo "$f : réponse $code"
            head -c 800 reponse.json; echo
            if [ "$code" -ge 300 ]; then exit 1; fi
          done
