name: Avis · base Supabase

# Applique 20261012120000_avis_langue.sql par l'API de gestion de Supabase,
# comme securite-base.yml, avec les secrets déjà là pour les fonctions
# (SUPABASE_ACCESS_TOKEN et SUPABASE_PROJECT_REF). Rien à faire à la main.
#
# La migration ajoute la langue de la page aux avis (colonne lang, que les
# formulaires du site envoient), et les deux fonctions du classement des
# pages de l'onglet Avis de l'admin. Elle ne ferme rien : elle peut passer
# avant comme après la publication du site, et un formulaire qui envoie la
# langue avant qu'elle existe renvoie l'avis sans elle.
#
# Le relancer (« Run workflow ») est toujours sans risque : la migration est
# idempotente.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261012120000_avis_langue.sql'
      - '.github/workflows/avis-base.yml'
  workflow_dispatch:

concurrency:
  group: avis-base
  cancel-in-progress: false

jobs:
  migration:
    name: Langue des avis et classement des pages
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # La dernière requête de la migration rend un bilan (nombre d'avis, avec
      # une langue enregistrée, avec une langue devinée) : il est affiché
      # dans le journal.
      - name: Appliquer la migration
        run: |
          f=supabase/migrations/20261012120000_avis_langue.sql
          jq -Rs '{query: .}' "$f" > requete.json
          code=$(curl -sS -o reponse.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data @requete.json)
          echo "$f : réponse $code"
          head -c 800 reponse.json; echo
          if [ "$code" -ge 300 ]; then exit 1; fi
