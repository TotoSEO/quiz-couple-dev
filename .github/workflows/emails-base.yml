name: E-mails · base Supabase

# Applique 20261024120000_emails_parcours.sql (le parcours e-mail des
# abonnés : envois, comptes, passages du soir, file, événements de Brevo,
# lecture de l'admin, horloge pg_cron), puis 20261024190000_emails_ordre.sql
# (la file du soir, le plus en retard d'abord), 20261027120000_emails_langues.sql
# (l'anglais d'abord, puis le français, l'italien, l'allemand, l'espagnol en
# dernier), 20261028120000_emails_recents.sql (les adresses de moins de
# 48 heures d'abord, puis les « e2 », puis le reste, les plus récents d'abord,
# la langue en second) et 20261029120000_emails_immediat.sql (l'e1 envoyé
# dans la minute par lead-capture, ses modèles et ses réglages, la file du
# soir sur sept jours, les événements du webhook transactionnel), par l'API
# de gestion de Supabase, comme abonnes-base.yml, avec les
# secrets déjà là (SUPABASE_ACCESS_TOKEN et SUPABASE_PROJECT_REF).
# Idempotentes : la relancer (« Run workflow ») est sans risque, et chacune
# repasse toujours après celles d'avant, qui réécrivent la file à l'ancienne.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261024120000_emails_parcours.sql'
      - 'supabase/migrations/20261024190000_emails_ordre.sql'
      - 'supabase/migrations/20261027120000_emails_langues.sql'
      - 'supabase/migrations/20261028120000_emails_recents.sql'
      - 'supabase/migrations/20261029120000_emails_immediat.sql'
      - '.github/workflows/emails-base.yml'
  workflow_dispatch:

concurrency:
  group: emails-base
  cancel-in-progress: false

jobs:
  migration:
    name: Tables du parcours et lecture de l'admin
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les migrations
        run: |
          for f in supabase/migrations/20261024120000_emails_parcours.sql \
                   supabase/migrations/20261024190000_emails_ordre.sql \
                   supabase/migrations/20261027120000_emails_langues.sql \
                   supabase/migrations/20261028120000_emails_recents.sql \
                   supabase/migrations/20261029120000_emails_immediat.sql; do
            jq -Rs '{query: .}' "$f" > requete.json
            code=$(curl -sS -o reponse.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data @requete.json)
            echo "$f : réponse $code"
            head -c 800 reponse.json; echo
            if [ "$code" -ge 300 ]; then exit 1; fi
          done
