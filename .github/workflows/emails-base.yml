name: E-mails · base Supabase

# Applique 20261024120000_emails_parcours.sql (le parcours e-mail des
# abonnés : envois, comptes, passages du soir, file, événements de Brevo,
# lecture de l'admin, horloge pg_cron) par l'API de gestion de Supabase,
# comme abonnes-base.yml, avec les secrets déjà là (SUPABASE_ACCESS_TOKEN et
# SUPABASE_PROJECT_REF). Idempotente : la relancer (« Run workflow ») est
# sans risque.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261024120000_emails_parcours.sql'
      - '.github/workflows/emails-base.yml'
  workflow_dispatch:

concurrency:
  group: emails-base
  cancel-in-progress: false

jobs:
  migration:
    name: Tables du parcours et lecture de l'admin
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer la migration
        run: |
          f=supabase/migrations/20261024120000_emails_parcours.sql
          jq -Rs '{query: .}' "$f" > requete.json
          code=$(curl -sS -o reponse.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data @requete.json)
          echo "$f : réponse $code"
          head -c 800 reponse.json; echo
          if [ "$code" -ge 300 ]; then exit 1; fi
