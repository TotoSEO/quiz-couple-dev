name: Deploy Supabase Edge Functions

# Déploie toutes les fonctions de supabase/functions/ vers le projet Supabase,
# sans terminal local : tout tourne dans GitHub Actions.
#
# Secrets requis (Repo → Settings → Secrets and variables → Actions) :
#   • SUPABASE_ACCESS_TOKEN  → Supabase Dashboard → (avatar en haut à droite)
#                              → Account → Access Tokens → Generate new token
#   • SUPABASE_PROJECT_REF   → le "ref" du projet = les xxxx dans
#                              https://xxxx.supabase.co (Project Settings → General)
#
# Lancement : onglet Actions → "Deploy Supabase Edge Functions" → Run workflow.
# Se relance aussi automatiquement quand une fonction change sur main.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Le deploiement ci-dessus n'efface jamais une fonction retiree du depot :
      # elle reste en ligne, et appelable, chez Supabase. trigger-deploy, qui
      # lancait une publication du site depuis l'admin avec un jeton GitHub, a
      # ete retiree le 7 octobre 2026 : on la supprime donc aussi chez
      # Supabase, avec les trois secrets qui ne servaient qu'a elle. Les deux
      # commandes ne font rien si c'est deja fait, et une erreur ne bloque pas
      # le deploiement : cette etape peut etre retiree une fois passee.
      - name: Retirer trigger-deploy et ses secrets (supprimés du dépôt)
        run: |
          supabase functions delete trigger-deploy --project-ref "$SUPABASE_PROJECT_REF" < /dev/null \
            || echo "trigger-deploy : déjà absente"
          supabase secrets unset GITHUB_DEPLOY_TOKEN GITHUB_REPO_OWNER GITHUB_REPO_NAME --project-ref "$SUPABASE_PROJECT_REF" < /dev/null \
            || echo "secrets GITHUB_* : déjà absents"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
