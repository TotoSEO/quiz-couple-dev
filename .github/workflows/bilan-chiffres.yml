name: Évaluation de couple · chiffres de l'admin

# Les chiffres de l'onglet Évaluation de l'admin (get_bilan_tableau) et ceux
# du parcours e-mail (get_emails_tableau), écrits au journal pour être lus
# sans le mot de passe de l'admin (bilan/chiffres.mjs ; 25 octobre 2026).
# À lancer à la main. Lecture seule : rien n'est écrit en base, et aucune
# adresse e-mail ni aucun prénom ne sort au journal.

on:
  workflow_dispatch:
    inputs:
      jours:
        description: 'Nombre de jours lus (30 par défaut)'
        required: false
        default: '30'

concurrency:
  group: bilan-chiffres
  cancel-in-progress: false

jobs:
  chiffres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bilan/chiffres.mjs
            emails/base.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chiffres
        env:
          JOURS: ${{ inputs.jours }}
        run: node bilan/chiffres.mjs
