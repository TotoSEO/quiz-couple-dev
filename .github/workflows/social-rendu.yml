name: Réseaux · synchro et rendu

# Toutes les heures : relit les posts écrits par la routine Claude sur la
# branche reseaux-atelier, les écrit dans Supabase, puis rend les fichiers des
# posts publiés dans les 48 prochaines heures (studio Remotion). Un post
# écrit pour le jour même est ainsi rendu dans l'heure. Deux jours d'avance
# plutôt qu'un : GitHub saute la plupart des départs programmés de ce dépôt
# (une exécution en neuf heures le 7 octobre 2026), l'horloge fiable est
# pg_cron (migration 20261008140000), et ce « schedule » n'est qu'un secours.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: social-rendu
  cancel-in-progress: false

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Posts de l'atelier
        id: atelier
        run: |
          if git ls-remote --exit-code --heads origin reseaux-atelier >/dev/null; then
            git fetch --depth 1 origin reseaux-atelier
            mkdir -p atelier && git --work-tree=atelier checkout FETCH_HEAD -- reseaux/atelier || true
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reseaux/studio/package-lock.json
      - name: Studio
        run: cd reseaux/studio && npm ci && npx remotion browser ensure
      # morceaux Mixkit : téléchargés une fois, gardés en cache tant que la
      # bibliothèque ne change pas ; le script ne refait que ce qui manque
      - uses: actions/cache@v4
        with:
          path: reseaux/studio/public/musique/mx-*.mp3
          key: musiques-${{ hashFiles('reseaux/studio/public/musique/bibliotheque.json') }}
          restore-keys: musiques-
      - name: Musiques
        run: cd reseaux/studio && node scripts/musiques.mjs
      - name: Synchro
        if: steps.atelier.outputs.present == 'true'
        run: node reseaux/automates/synchro.mjs atelier/reseaux/atelier/posts
      - name: Rendu
        run: node reseaux/automates/rendu.mjs --heures 48
