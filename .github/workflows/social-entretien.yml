name: Réseaux · entretien

# Chaque jour : vérifie le jeton de la Page Facebook, fait le ménage du stockage,
# relève les statistiques, puis écrit l'état du planning (créneaux à remplir,
# posts récents, idées, statistiques) sur la branche reseaux-atelier, où la
# routine Claude le lit avant d'écrire.

on:
  schedule:
    # Secours seulement : l'horloge réelle est pg_cron (3 h 11 UTC, avant la
    # routine Claude de 5 h 44 à Paris, qui lit l'état écrit ici).
    - cron: '11 3 * * *'
  workflow_dispatch:

concurrency:
  group: social-entretien
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  entretien:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Entretien
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node reseaux/automates/entretien.mjs --etat "$RUNNER_TEMP/etat.json" --etat-fr "$RUNNER_TEMP/etat-fr.json"
      # Un état par atelier, chacun sur sa branche : reseaux-atelier pour
      # Quiz Couple, mipaps-atelier pour Les mipaps (créée ici si besoin).
      - name: État pour les ateliers
        run: |
          git config user.name 'quiz-couple-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          deposer() {
            branche="$1"; source="$2"; cible="$3"
            [ -f "$source" ] || return 0
            if git ls-remote --exit-code --heads origin "$branche" >/dev/null; then
              git checkout -B "$branche" "origin/$branche"
            else
              git checkout -B "$branche"
            fi
            mkdir -p "$(dirname "$cible")/posts"
            cp "$source" "$cible"
            git add "$cible"
            git diff --cached --quiet || git commit -m "Atelier : état du planning"
            git push origin "$branche"
          }
          deposer reseaux-atelier "$RUNNER_TEMP/etat.json" reseaux/atelier/etat.json
          deposer mipaps-atelier "$RUNNER_TEMP/etat-fr.json" reseaux/mipaps/atelier/etat.json
